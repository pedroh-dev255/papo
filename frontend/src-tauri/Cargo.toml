[package]
name = "papo"
version = "0.1.0"
description = "Papo - Comunicação empresarial"
authors = ["PH Core"]
edition = "2021"

[lib]
name = "papo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = [
    "custom-protocol",
    "tray-icon",
    "process-relaunch-dangerous-allow-symlink-macos"
] }
log = "0.4"
tauri-plugin-log = { version = "2.0.0-rc.2", package = "tauri-plugin-log" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
